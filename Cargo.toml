[package]
name = "net_info"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "HTTP request visualizer with detailed timing breakdown (DNS, TCP, TLS, HTTP)"
autobins = false

[[bin]]
name = "net-info"
path = "src/main.rs"

[lib]
name = "net_info"
path = "src/lib.rs"

[features]
default = []
otel = []

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
hickory-resolver = { version = "0.26.3", features = ["system-config", "tokio"] }
http = "1.5.0"
http-body-util = { version = "0.1.5", features = ["full"] }
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "http1", "http2"] }
idna = "1.1.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-socks = "0.5.3"
url = "2.5.8"
webpki-roots = "1.0.12"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
